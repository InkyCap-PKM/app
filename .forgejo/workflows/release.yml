# Release pipeline for InkyCap on Codeberg (Forgejo Actions).
#
# Trigger: pushing a tag like `v26.6.1`. The job builds the signed,
# self-updating bundle, attaches it to the Forgejo release, regenerates the
# updater manifest, and publishes it to the Codeberg Pages branch so the
# in-app "Check for updates" can find it.
#
# Channel routing follows InkyCap's versioning scheme (see
# documentation/developer/releasing.md): versions are YY.MM.RELEASE and the
# last (RELEASE) component selects the channel — EVEN is a user-facing/stable
# release (published to updates/stable/), ODD is a development/beta release
# (updates/beta/).
#
# Required repository secrets (Settings → Actions → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if you generated without one)
#   PAGES_PUSH_TOKEN                    a token with write access to the pages branch
#
# IMPORTANT — platform coverage: Codeberg's shared runners are Linux-only, so
# this workflow builds the Linux AppImage. Windows/macOS artifacts must be
# produced on their own platforms (a self-hosted runner with the matching label,
# or a local `npm run tauri build`) and attached to the same release; re-run the
# "manifest" step afterwards (or `npm run manifest:gen` locally) to fold their
# signatures in. The manifest generator is platform-set agnostic.

on:
  push:
    tags:
      - "v*"

jobs:
  release-linux:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2 file build-essential curl wget jq perl

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch Tinymist sidecar
        run: ./scripts/download-tinymist.sh x86_64-unknown-linux-gnu

      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles appimage

      - name: Attach artifacts to the release
        env:
          TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # Resolve (or create) the release for this tag.
          REL_ID=$(curl -fsSL -H "Authorization: token ${TOKEN}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -z "${REL_ID}" ]; then
            REL_ID=$(curl -fsSL -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}" \
              "${API}/releases" | jq -r '.id')
          fi
          # Upload each AppImage and its detached signature.
          for f in $(find src-tauri/target/release/bundle/appimage -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' \)); do
            curl -fsSL -X POST -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" \
              "${API}/releases/${REL_ID}/assets?name=$(basename "$f")"
          done

      - name: Generate and publish updater manifest
        env:
          TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Channel from the last (RELEASE) component: even = stable, odd = beta.
          RELEASE=$(echo "${VERSION}" | cut -d. -f3)
          if [ $((RELEASE % 2)) -eq 0 ]; then CHANNEL="stable"; else CHANNEL="beta"; fi
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          node scripts/gen-update-manifest.mjs \
            --base-url "${BASE}" \
            --version "${VERSION}" \
            --artifacts src-tauri/target/release/bundle \
            --notes "See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --out latest.json

          # Publish to the `pages` branch at <channel>/latest.json. That branch
          # is served at https://updates.inkycap.org/ via a Codeberg Pages custom
          # domain (a `.domains` file on the branch + a DNS CNAME), so the public
          # URL is https://updates.inkycap.org/<channel>/latest.json.
          git clone --depth 1 --branch pages \
            "https://x-access-token:${TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" pages
          mkdir -p "pages/${CHANNEL}"
          cp latest.json "pages/${CHANNEL}/latest.json"
          cd pages
          git config user.name "InkyCap Release Bot"
          git config user.email "release@inkycap.org"
          git add "${CHANNEL}/latest.json"
          git commit -m "release: ${CHANNEL} manifest for ${TAG}" || echo "no changes"
          git push origin pages
