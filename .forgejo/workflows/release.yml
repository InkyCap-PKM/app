# Release pipeline for InkyCap on Codeberg (Forgejo Actions).
#
# Trigger: pushing a tag like `v26.6.1`. The job builds the portable Linux
# packages (.deb + .rpm) and attaches them to the Forgejo release. The Windows
# installer, the Flatpak bundle, and the updater manifest are added locally
# afterwards (see documentation/developer/releasing.md) — they can't be built or
# published here (Windows is a different OS; Flatpak needs flatpak-builder + the
# GNOME runtime; and the manifest needs the signed Windows artifact).
#
# Channel routing follows InkyCap's versioning scheme (see
# documentation/developer/releasing.md): versions are YY.MM.RELEASE and the
# last (RELEASE) component selects the channel — EVEN is a user-facing/stable
# release (published to updates/stable/), ODD is a development/beta release
# (updates/beta/).
#
# Required repository secrets (Settings → Actions → Secrets):
#   PAGES_PUSH_TOKEN  a token with write access to the repo (to create the
#                     release and upload assets). The signing-key secrets aren't
#                     used here — .deb/.rpm are unsigned manual-update packages —
#                     but they're still needed for the local Windows build.
#
# The .deb/.rpm built here are package-manager installs and update manually, so
# they carry no minisign signature and no updater-manifest entry. Linux users
# see only the "a newer version is available → View releases" notice (the
# in-app updater reads the manifest's top-level `version`).

on:
  push:
    tags:
      - "v*"

jobs:
  release-linux:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file ca-certificates git pkg-config jq \
            libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev libgtk-3-dev \
            xdg-utils patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch Tinymist sidecar
        run: ./scripts/download-tinymist.sh x86_64-unknown-linux-gnu

      - name: Build Linux packages (.deb + .rpm)
        # createUpdaterArtifacts + a configured pubkey makes Tauri demand a
        # signing key on every build; the --config override disables updater
        # artifacts for these manual-install packages so the unsigned CI build
        # succeeds (the signed Windows build keeps updater artifacts on).
        run: |
          npm run tauri build -- --bundles deb rpm \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the built binary's version matches the tag
        # Catches a stale build (or a tag/version-bump mismatch): the version
        # the binary reports at runtime — what Settings -> Overview shows — must
        # equal the pushed tag. `--version` exits before any GUI init, so it
        # runs headless. A mismatch fails the release before anything is
        # published.
        run: |
          set -euo pipefail
          EXPECT="${GITHUB_REF_NAME#v}"
          GOT="$(src-tauri/target/release/inkycap --version)"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::Built binary reports $GOT but the tag is v$EXPECT (stale build or unbumped version?)."
            exit 1
          fi
          echo "Verified: built binary reports version $EXPECT (matches tag)."

      - name: Attach .deb and .rpm to the release
        env:
          TOKEN: ${{ secrets.PAGES_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # Resolve (or create) the release for this tag. Beta = odd RELEASE
          # (last version component) → mark it a prerelease.
          VERSION="${TAG#v}"
          RELEASE=$(echo "${VERSION}" | cut -d. -f3)
          if [ $((RELEASE % 2)) -eq 0 ]; then PRERELEASE=false; else PRERELEASE=true; fi
          REL_ID=$(curl -fsSL -H "Authorization: token ${TOKEN}" "${API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -z "${REL_ID}" ]; then
            # Created as a DRAFT: the maintainer attaches the Windows installer
            # (+.sig) and the Flatpak, then publishes the release by hand, then
            # publishes the manifest (scripts/publish-manifest.sh). Draft asset
            # download URLs only resolve once published — so the manifest, which
            # points at them, must be published last.
            REL_ID=$(curl -fsSL -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":true,\"prerelease\":${PRERELEASE}}" \
              "${API}/releases" | jq -r '.id')
          fi
          # Upload the .deb and .rpm. These are package-manager installs (manual
          # updates), so they carry no .sig and no updater-manifest entry.
          for f in $(find src-tauri/target/release/bundle/deb src-tauri/target/release/bundle/rpm -type f \( -name '*.deb' -o -name '*.rpm' \)); do
            curl -fsSL -X POST -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" \
              "${API}/releases/${REL_ID}/assets?name=$(basename "$f")"
          done

      # The Windows installer (+.sig), the Flatpak bundle, and the updater
      # manifest are produced and published LOCALLY after this job — see the
      # "Cutting a release" section of documentation/developer/releasing.md.
