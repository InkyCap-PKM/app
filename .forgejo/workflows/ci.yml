# Forgejo Actions workflow for CodeFloe CI.
#
# INERT until you enable Actions on the repository:
#   CodeFloe → repo → Settings → Actions → enable, and ensure a runner is
#   available (CodeFloe offers shared runners; see its Forgejo Actions docs).
# Once enabled, every push and pull request runs these gates server-side,
# unbypassable.
#
# Jobs:
#   - rustfmt:  formatting gate (fast).
#   - clippy:   lint gate, `-D warnings` (the tree is clippy-clean; this keeps
#               it that way). Two crate-wide allows live in src-tauri/src/lib.rs
#               for inherent domain shape — see the comment there.
#   - rust-test: the Rust unit + integration tests.
#   - frontend: TypeScript typecheck, i18n key/placeholder parity, and the
#               Vitest suite.
#
# A full Tauri *bundle* (the packaged app) is deliberately not built here — it
# is heavy on runner minutes and the unit/integration suites cover the logic.
# `runs-on: docker` targets CodeFloe's shared runners, which all advertise a
# `docker` label (alongside `debian-latest`, `ubuntu-latest`, `alpine-latest`
# and friends) and report cpu=4 with 7-10 GB of memory. Adjust if your runner
# advertises different labels.
name: CI

# `workflow_dispatch` adds a "Run workflow" button in the web UI, so the whole
# gate can be re-run without pushing anything.
on:
  push:
    # Branches only. A release tag points at a commit that already went through
    # this gate when it was pushed to its branch, so a tag push would just run
    # everything a second time and staple a second verdict onto the same commit
    # — which is how a flake ends up showing as a failed check on the release
    # page. `**` matches every branch, including names containing a slash, and
    # excludes tags.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  rustfmt:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - name: Check out the repository
        # NOT actions/checkout here. That is a JavaScript action, and Forgejo
        # runs it with `node` inside this job's container; the official Rust
        # image has no Node, so it exits 127 before anything else happens.
        # Cloning by hand keeps the pinned Rust toolchain image and needs no
        # extra tooling. The `frontend` job below runs in a Node image, so it
        # uses the action normally.
        # Anything added to these three jobs must likewise avoid JS actions.
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

  clippy:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - name: Check out the repository
        # NOT actions/checkout here. That is a JavaScript action, and Forgejo
        # runs it with `node` inside this job's container; the official Rust
        # image has no Node, so it exits 127 before anything else happens.
        # Cloning by hand keeps the pinned Rust toolchain image and needs no
        # extra tooling. The `frontend` job below runs in a Node image, so it
        # uses the action normally.
        # Anything added to these three jobs must likewise avoid JS actions.
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config
      - name: Ensure clippy is installed
        run: rustup component add clippy
      - name: Fetch Tinymist sidecar
        # tauri.conf.json declares the Tinymist sidecar as an external binary,
        # so the Tauri build script refuses to run without it. It is ~30 MB and
        # deliberately not in the repo, which is why a fresh clone (and this
        # job) has to fetch it before anything will compile.
        #
        # No target triple on purpose: CodeFloe's `docker` pool mixes amd64 and
        # arm64 machines, and which one a job lands on varies run to run. Naming
        # a triple here fetches the wrong binary whenever the runner is arm64,
        # and Tauri's build script then fails on the missing
        # `binaries/inkycap-tinymist-aarch64-unknown-linux-gnu`. Letting the
        # script detect the host keeps both architectures working.
        run: ./scripts/download-tinymist.sh
      - name: Lint with clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --tests -- -D warnings

  rust-test:
    runs-on: docker
    container:
      image: rust:1-bookworm
    steps:
      - name: Check out the repository
        # NOT actions/checkout here. That is a JavaScript action, and Forgejo
        # runs it with `node` inside this job's container; the official Rust
        # image has no Node, so it exits 127 before anything else happens.
        # Cloning by hand keeps the pinned Rust toolchain image and needs no
        # extra tooling. The `frontend` job below runs in a Node image, so it
        # uses the action normally.
        # Anything added to these three jobs must likewise avoid JS actions.
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config
      - name: Fetch Tinymist sidecar
        # tauri.conf.json declares the Tinymist sidecar as an external binary,
        # so the Tauri build script refuses to run without it. It is ~30 MB and
        # deliberately not in the repo, which is why a fresh clone (and this
        # job) has to fetch it before anything will compile.
        #
        # No target triple on purpose: CodeFloe's `docker` pool mixes amd64 and
        # arm64 machines, and which one a job lands on varies run to run. Naming
        # a triple here fetches the wrong binary whenever the runner is arm64,
        # and Tauri's build script then fails on the missing
        # `binaries/inkycap-tinymist-aarch64-unknown-linux-gnu`. Letting the
        # script detect the host keeps both architectures working.
        run: ./scripts/download-tinymist.sh
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: docker
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: i18n key/placeholder parity
        run: npm run i18n:check
      - name: Run frontend tests
        run: npm run test
