name: Bug report
about: Report something that is broken or behaving incorrectly
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve InkyCap. The more specific you are, the
        faster this can be fixed. Please do not paste private note contents you
        would rather keep local; a minimal reproduction is enough.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Platform / OS
      placeholder: e.g. Linux Fedora 41, Windows 11, macOS 14
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      options:
        - AppImage
        - .deb
        - .rpm
        - Flatpak
        - Windows installer
        - macOS .app
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: InkyCap version
      description: Settings, Overview; or the release tag you installed.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes, logs, or screenshots
      description: Error text, a screenshot, or anything else that helps.
    validations:
      required: false
