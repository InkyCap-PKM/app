[package]
name = "inkycap"
version = "26.9.2"
edition = "2021"
description = "A Tauri-based Typst editor for academic note-taking"

[lib]
name = "inkycap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
# In-app "Check for updates" is notify-only: commands::updates queries Codeberg's
# releases API (via reqwest) and the UI links to the releases page. InkyCap does
# not self-update — no signed manifest, no in-place install. Checks run only when
# the user clicks, or on startup if they opt in (local-first, no telemetry).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 is the final release — the crate is archived/unmaintained
# upstream. It still works and has no open advisories, but if YAML support
# grows or an advisory lands, migrate to a maintained fork (`serde_yml`) or
# move the (small) YAML surface — markdown frontmatter parsing — to TOML.
serde_yaml = "0.9"
walkdir = "2"
notify = "8"
pulldown-cmark = "0.12"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde", "unstable-locales"] }
tauri-plugin-dialog = "2.7.0"
dirs = "6.0.0"
rayon = "1"
trash = "5"
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
# Embeds the bundled user-manual noteboxes (documentation/manual/*) into the
# binary at compile time, so the documentation window has its content with no
# runtime resource-path resolution and the docs version stays atomic with the
# app. Build-time proc-macro only; no runtime transitive deps. Chosen over
# Tauri `bundle.resources` to avoid cross-platform resource-dir path handling.
include_dir = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1"
tempfile = "3"
which = "7"
zip = { version = "2", features = ["aes-crypto", "deflate"] }
tar = "0.4"
# OS keychain wrapper for the notebox backup password. Each platform
# uses its native credential store: Secret Service (gnome-keyring,
# kwallet, KeePassXC, …) on Linux, Keychain on macOS, Credential
# Manager on Windows. The password is never written to settings.json.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Use rustls so the binary doesn't link OS-native TLS — keeps cross-platform
# behavior identical. Picked over `ureq` because it's already in the
# dependency graph via tauri.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Unicode collation for user-facing name sorting (src/sort.rs), so the
# backend orders names identically to the frontend's `Intl.Collator`.
# Already in the dependency graph via typst-library -> hayagriva, so this
# is a direct dep on a crate the binary was compiling regardless.
icu_collator = "2.2"
# NFC normalization for the notebox name audit: `café` written as one
# codepoint and as `e` + combining acute are two files on Linux and Windows
# but one on macOS. Already in the graph beneath icu_collator, so this is a
# direct dep on a crate the binary was compiling regardless.
icu_normalizer = "2.2"
log = "0.4"
env_logger = "0.11"

# Notebox-level git collaboration transport. We vendor both libgit2 and
# openssl (`vendored-libgit2` + `vendored-openssl`) so the binary carries
# its own copies and does not link the host's libgit2/OpenSSL. This is the
# same self-contained stance the `reqwest` dep takes with rustls: identical
# behaviour on every platform and no dependence on a system git or TLS
# install (the collaboration design requires working with "no system git
# installed"). libgit2 cannot use rustls, so vendored openssl is the
# closest equivalent. `ssh`/`https` enable both transports (in-memory SSH
# keys come with `ssh`); the build needs a C compiler + perl, which the
# Typst/rusqlite deps already require.
git2 = { version = "0.21", default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
    "ssh",
    "https",
] }
# Line-level text diffing for the collaboration review renderer (maps a 3-way
# diff onto inline #suggestion markup). Pure Rust, no C deps; widely vetted
# (the diff engine behind `insta`). Only the default `text` feature is needed.
similar = "2"

# Typst compile pipeline. Pinned to 0.15.x (typst 0.15.1). Bumping the minor
# requires re-running the pin benchmark and reviewing the fidelity snapshot
# corpus against the new pin:
#   cargo test --test fidelity                         # output didn't shift
#   cargo test --release --test fidelity -- --ignored --nocapture pin_benchmark
# See documentation/developer/typst-upgrade.md for the full runbook.
fontdb = "0.23"
# Typst's memoization cache. Already in the lock graph via `typst`; pinned here
# as a direct dependency so the compile loop can bound it with `comemo::evict`
# (same crate version → same global cache typst's memoized functions use).
comemo = "0.5"
# System/notebox font files are memory-mapped rather than read into the heap,
# so unused faces never pin their bytes (see typst_pipeline::fonts). Already in
# the lock graph transitively; pinned here as a direct dependency.
memmap2 = "0.9"
typst = "0.15"
typst-library = "0.15"
# The layout engine was split into its own crate in 0.15; `PagedDocument`
# (and the layout routine) now live here rather than under `typst::layout`.
typst-layout = "0.15"
typst-svg = "0.15"
typst-pdf = "0.15"
typst-html = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
hayagriva = "0.9"
biblatex = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# XDG Desktop Portal client. Used only when running inside a flatpak sandbox,
# to route "move to trash" through the portal's Trash interface — the `trash`
# crate's freedesktop mount-detection is confused by the sandbox's bind mounts
# and fails with EACCES trying to write /home/.Trash-$uid. The portal performs
# the operation host-side, matching the behaviour of the non-sandboxed builds.
# (A home-trash fallback in storage/local.rs covers portal versions where the
# CVE-2026-40354 fix regressed sandboxed trashing.)
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }

# Percent-encoding for the FreeDesktop trashinfo `Path=` field, used by the
# home-trash fallback that runs when the portal itself fails (the CVE-2026-40354
# fix regressed sandboxed trashing on portal 1.20.4–1.21.1). Already in the tree
# transitively via `url`; declared directly so the fallback owns its dependency.
percent-encoding = "2"

# Native clipboard reader for macOS (NSPasteboard via Objective-C
# runtime). Used by read_clipboard_file_paths to get file URIs the
# webview can't see because of WebKit's cross-origin clipboard
# policy. Same role as the `gtk` dep above, just a different OS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# Native clipboard reader for Windows (CF_HDROP via Win32). Same
# role as the Linux/macOS deps above.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
# Snapshot testing for the Typst-output fidelity corpus (tests/fidelity.rs).
# Backed by `similar` (already a runtime dep). The `glob` feature drives one
# snapshot set per `.typ` fixture; see documentation/developer/typst-upgrade.md.
insta = { version = "1", features = ["glob", "json"] }
