<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
     width="466" height="560" viewBox="100 56 466 560" version="1.1">
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>InkyCap</dc:title>
        <dc:creator><cc:Agent><dc:title>Joshua Chalifour</dc:title></cc:Agent></dc:creator>
