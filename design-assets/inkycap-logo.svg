  </metadata>

  <!-- InkyCap mark: a bespectacled mushroom scholar.
       Draw order is back-to-front: stem, base, cap, pleats, glasses.
       Palette: cap #1d7874 (teal), stem + base #679289 (sage),
       glasses #071e22 (ink), lenses #fff. -->

  <!-- Stem (behind the cap) -->
  <path d="m 288.03001,483.42766 c -14.27714,54.31331 -14.27714,93.10852 0,120.26517 h 99.93998 c 14.27715,-27.15665 14.27715,-65.95186 0,-120.26517 z"
        fill="#679289"/>
  <ellipse cx="338" cy="595.43927" rx="64.247131" ry="15.914431" fill="#679289"/>

  <!-- Cap: dome silhouette + melting rim -->
  <g transform="matrix(3.0375,0,0,2.824516,-1022.3458,739.70562)" fill="#1d7874">
    <path d="m 447.85046,-239 c -50,10.40055 -76,70.72377 -70,131.04698 4,33.281771 136,33.281771 140,0 6,-60.32321 -20,-120.64643 -70,-131.04698 z"/>
    <path d="m 377.85046,-113 c 8,0 12.789,6.70242 16.789,14.702418 4,-7.999998 11.43643,-7.774568 15.43643,4.225432 4,-12 12.22543,-10.30928 16.22543,1.69072 4,-12 -5.67749,-3.497134 12.52284,5.148638 C 470.29366,-74.461671 453.85046,-101 457.85046,-89 c 4,-12 12.789,-14.59243 16.789,-2.59243 4,-12 11.32371,-11.43643 15.32371,-3.436432 4,-7.999998 11.88729,-15.971138 27.88729,-17.971138 v 22 c -14,0 -18,10 -22,18 -4,-8 -12,-10 -16,-2 -4,-8 -12,-8 -16,0 -4,-8 -12,-8 -16,2 -4,-10 -12,-10 -16,-2 -4,-8 -12,-8 -16,0 -4,-8 -12,-6 -16,2 -4,-8 -12,-14 -22,-18 z"/>
  </g>

  <!-- Pleat striations on the cap -->
  <g transform="matrix(1.7976888,0,0,1.7976888,-21.53776,-193.67838)"
     fill="none" stroke="#b3b3b3" stroke-width="1" opacity="0.55">
    <path d="M 200,185 V 350"/>
    <g>
      <path d="M 185,185 170,350"/><path d="M 170,190 140,350"/>
      <path d="M 155,200 120,350"/><path d="M 140,215 105,350"/>
      <path d="M 125,235 95,350"/>
    </g>
    <g transform="matrix(-1,0,0,1,400,0)">
      <path d="M 185,185 170,350"/><path d="M 170,190 140,350"/>
      <path d="M 155,200 120,350"/><path d="M 140,215 105,350"/>
      <path d="M 125,235 95,350"/>
    </g>
  </g>

  <!-- Glasses: white lenses, ink frames + bridge, ink pupils -->
  <g transform="matrix(6.2265645,0,0,6.1540361,26.671775,38.471824)">
    <circle cx="35" cy="45" r="10" fill="#ffffff"/>
    <circle cx="65" cy="45" r="10" fill="#ffffff"/>
    <g fill="none" stroke="#071e22" stroke-width="2.33964">
      <circle cx="35" cy="45" r="10"/>
      <circle cx="65" cy="45" r="10"/>
      <line x1="45" y1="45" x2="55" y2="45"/>
    </g>
    <circle cx="35" cy="45" r="3.6" fill="#071e22"/>
    <circle cx="65" cy="45" r="3.6" fill="#071e22"/>
  </g>
</svg>
