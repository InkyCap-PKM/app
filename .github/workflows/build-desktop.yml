# Installer builds for InkyCap on every platform.
#
# WHY THIS LIVES ON GITHUB
# ------------------------
# The project's home is codefloe.com/InkyCap/app. CodeFloe has no macOS or
# Windows runners, so this repository is a *build mirror*: a push-only copy of
# `main` that exists to produce the installers. The Linux packages are built
# here too, on native x86_64 and ARM runners, so one run produces a whole
# release; they use the same scripts as a local build (scripts/build-*.sh),
# so building them on your own computer still works and gives the same files.
# Issues, pull requests and published releases stay on CodeFloe. The one
# exception: an installer larger than CodeFloe accepts as an attachment goes
# on a GitHub release with the same tag, created by hand (the release feeds
# script, scripts/release-feeds.mjs, lists which files). This workflow
# deliberately does NOT create a GitHub release.
#
# HOW IT FITS THE RELEASE RUNBOOK
# -------------------------------
# The release process attaches the installers to a CodeFloe *draft* and
# publishes by hand — and publishing the draft is what creates the git tag.
# So at build time the tag does not exist yet, which is why this runs only on
# `workflow_dispatch` (you press the button) and never on a push. Download the
# artifacts from the run summary and attach them to the draft.
#
# For an after-the-fact rebuild, press the button and give the `ref` input the
# release tag once it has been mirrored across. There is deliberately no tag
# trigger: mirroring the tag is housekeeping that happens after the installers
# are already built, and a trigger there only rebuilt them a second time.
#
# WHAT IT PRODUCES
# ----------------
#   inkycap-macos-aarch64   .dmg + .app.tar.gz   (Apple silicon)
#   inkycap-macos-x86_64    .dmg + .app.tar.gz   (Intel, cross-compiled)
#   inkycap-windows-x86_64  *-setup.exe + .msi
#   inkycap-linux-x86_64    .deb + .rpm + .AppImage + .flatpak
#   inkycap-linux-aarch64   .deb + .rpm + .AppImage
#
# The .app.tar.gz is what the in-app Upgrade button installs on macOS. None of
# these files are signed for the updater here; that happens on the
# maintainer's computer afterwards (scripts/release-feeds.mjs).
#
# The macOS builds are NOT code-signed or notarized — macOS users will see an
# "unidentified developer" warning. Setting that up needs an Apple Developer
# account and two repository secrets (a signing certificate and an
# app-specific password for notarytool).

name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: false
        default: main

# One build at a time per ref; a newer request cancels an in-flight one.
concurrency:
  group: build-desktop-${{ github.event.inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going if one platform fails, so a Windows problem doesn't cost you
      # the macOS artifacts (and vice versa).
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app dmg
            artifact: inkycap-macos-aarch64
            # The runner is Apple silicon, so the built binary runs natively
            # and the version self-check below can execute it.
            native: true

          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app dmg
            artifact: inkycap-macos-x86_64
            # Cross-compiled from the Apple-silicon runner. Running an x86_64
            # binary here would need Rosetta 2, which isn't installed, so the
            # version self-check is skipped for this one.
            native: false

          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
            artifact: inkycap-windows-x86_64
            native: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No toolchain action: rust-toolchain.toml pins the exact compiler
      # (1.94.1 at time of writing) and rustup honours it from the repo root.
      # `rustup show` is what actually installs that pinned toolchain; without
      # it the `target add` below could attach the target to the wrong one.
      - name: Install the pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install JS dependencies
        run: npm ci

      # The Tinymist language-server sidecar is not in the repo (~30 MB per
      # platform); the script fetches it and verifies a committed SHA-256.
      - name: Fetch Tinymist sidecar
        shell: bash
        run: ./scripts/download-tinymist.sh ${{ matrix.target }}

      - name: Build the installers
        shell: bash
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Mirrors the check in the CodeFloe release workflow: the version the
      # binary reports at runtime (what Settings -> Overview shows) must match
      # package.json. Catches a version bump that didn't reach every manifest.
      - name: Verify the built binary's version
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          EXPECT="$(node -p "require('./package.json').version")"
          BIN="src-tauri/target/${{ matrix.target }}/release/inkycap"
          [ -f "$BIN" ] || BIN="${BIN}.exe"
          GOT="$("$BIN" --version)"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::Built binary reports '$GOT' but package.json says '$EXPECT'."
            exit 1
          fi
          echo "Verified: built binary reports version $EXPECT."

      # The Upgrade button on macOS installs a compressed copy of the app, not
      # the .dmg. The updater unpacks it by dropping the archive's top folder,
      # so InkyCap.app must sit at the archive's root. The file is signed
      # later, on the maintainer's computer (scripts/release-feeds.mjs), which
      # is why this job needs no secrets.
      - name: Make the macOS update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          case "${{ matrix.target }}" in
            aarch64-*) ARCH=aarch64 ;;
            x86_64-*)  ARCH=x64 ;;
          esac
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          tar -czf "$DIR/InkyCap_${VERSION}_${ARCH}.app.tar.gz" -C "$DIR" InkyCap.app

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

  # The Linux packages, built with the same scripts as a local build, each on
  # a runner of its own architecture. The ARM runner builds natively (no
  # emulation); it skips the Flatpak, which is published for x86_64 only.
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            flatpak: true
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            flatpak: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}

      # The Rust build, the two build containers and the AppImage's working
      # copy need more room than the runner leaves free. These preinstalled
      # SDKs are unused here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Builds in the Ubuntu 22.04 container (Dockerfile.build), so the
      # packages run on every distribution from that one on, and checks that
      # the program reports the version in tauri.conf.json.
      - name: Build the .deb and .rpm
        run: ./scripts/build-linux-docker.sh --target ${{ matrix.target }} --bundles deb,rpm

      # Repackages the .deb just built; the script also starts the result on a
      # virtual display and fails if it doesn't keep running.
      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Install the Flatpak tools
        if: matrix.flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu 24.04 blocks the unprivileged user namespaces that
          # flatpak-builder's sandbox is made of.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the Flatpak
        if: matrix.flatpak
        run: ./scripts/build-flatpak.sh

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: inkycap-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.AppImage
            dist-linux/*.flatpak
